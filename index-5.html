<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pages Hub</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bar:#0f172a; --side:#111c33; --sel:#27407a; --bg:#eef1f6;
    --text:#1c2333; --muted:#4b566b; --border:#c9d2e3; --white:#ffffff;
    --side-text:#f1f5f9; --side-muted:#cbd5e1; --side-faint:#94a3b8; --accent:#1d4ed8;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
  button{font-family:inherit}
  [hidden]{display:none !important}

  /* ---------- Gate ---------- */
  #gate{display:none;height:100%;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,#0f172a 0%,#1b2a47 100%)}
  body.locked #gate{display:flex}
  body.locked #app{display:none}
  .gate-card{width:100%;max-width:380px;background:var(--white);border-radius:16px;padding:28px 24px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .gate-card svg.logo{margin-bottom:6px}
  .gate-card h2{margin:0 0 4px;font-size:1.3rem}
  .gate-card p{margin:0 0 16px;color:var(--muted);font-size:.9rem}
  .gate-row{display:flex;gap:8px}
  .gate-row input{flex:1;min-width:0;padding:12px 14px;border-radius:10px;border:1px solid var(--border);font-size:1rem;color:var(--text);background:#fff}
  .gate-row button{padding:12px 16px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:1rem;cursor:pointer}
  .gate-row button:disabled{opacity:.5;cursor:default}
  #gate-err{min-height:1.4em;margin-top:12px;font-size:.9rem;color:#b91c1c}
  #gate-err.info{color:var(--muted)}
  #gate-out{width:100%;margin-top:10px;padding:10px;border-radius:10px;border:1px solid var(--border);font-family:monospace;font-size:.8rem;color:var(--text);background:#f8fafc}
  .gate-foot{margin-top:18px;font-size:.75rem;color:var(--muted)}

  /* ---------- App shell ---------- */
  #app{height:100%;height:100dvh;display:flex;flex-direction:column}
  .titlebar{flex:0 0 48px;height:48px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--bar);color:#e5e7eb}
  .brand{font-size:15px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
  .center{flex:1;text-align:center;font-size:13px;color:var(--side-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .idle{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;background:#1b2a47;color:#cbd5e1;font-size:12px;white-space:nowrap}
  .idle.warn{background:#7c2d12;color:#ffedd5}
  .tb-btn{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid #334155;border-radius:8px;background:transparent;color:#e5e7eb;font-size:13px;cursor:pointer}
  .tb-btn:hover{background:#1b2a47}
  .menu-btn{display:none;align-items:center;justify-content:center;width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:#e5e7eb;cursor:pointer}

  .body{flex:1 1 0;min-height:0;display:flex}
  #side{flex:0 0 272px;width:272px;display:flex;flex-direction:column;gap:14px;padding:16px 12px;background:var(--side);color:var(--side-text);min-height:0}
  .searchrow{display:flex;gap:8px}
  #q{flex:1;min-width:0;height:40px;padding:0 12px;border-radius:8px;border:0;background:#1b2a47;color:#f1f5f9;font-size:14px}
  #q::placeholder{color:#cbd5e1}
  #refresh{flex:0 0 40px;height:40px;border:0;border-radius:8px;background:#1b2a47;color:#cbd5e1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .label{font-size:12px;font-weight:600;letter-spacing:.8px;color:var(--side-faint);padding:0 12px;display:flex;justify-content:space-between}
  #list{display:flex;flex-direction:column;gap:4px;overflow-y:auto;min-height:0}
  .item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:var(--side-text);text-align:left;cursor:pointer}
  .item:hover{background:#18284a}
  .item.sel{background:var(--sel)}
  .item .n{font-size:14px;font-weight:600;word-break:break-word}
  .item .d{font-size:12px;color:var(--side-muted)}
  .note{padding:14px 12px;font-size:13px;color:var(--side-muted)}
  .spacer{flex:1}
  .lockinfo{display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12px;color:var(--side-faint)}

  main{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;padding:16px}
  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .bar h1{margin:0;font-size:18px;font-weight:600;flex:1;min-width:120px}
  .btn{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--white);color:var(--text);font-size:13px;cursor:pointer}
  .btn:disabled{opacity:.45;cursor:default}
  .viewport{flex:1 1 0;min-height:0;position:relative;border:1px solid var(--border);border-radius:12px;background:var(--white);overflow:hidden}
  .viewport iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  .welcome{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
  .welcome .t{font-size:20px;font-weight:600}
  .welcome .s{font-size:14px;color:var(--muted);max-width:420px}

  footer{flex:0 0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;background:var(--white);border-top:1px solid #d5dbe8;font-size:12px;color:var(--muted);text-align:center}

  /* ---------- Small screens ---------- */
  @media (max-width:760px){
    .menu-btn{display:flex}
    .center{display:none}
    .brand{flex:1}
    .idle span.lbl{display:none}
    .tb-btn span{display:none}
    #side{position:fixed;left:0;top:48px;bottom:0;z-index:20;width:290px;transform:translateX(-102%);transition:transform .2s;box-shadow:6px 0 24px rgba(0,0,0,.3)}
    body.drawer #side{transform:none}
    main{padding:10px}
  }
</style>
</head>
<body class="locked">

<!-- ================= Password gate ================= -->
<div id="gate">
  <div class="gate-card">
    <svg class="logo" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>
    <h2 id="gate-title">Pages Hub</h2>
    <p id="gate-text">Enter the password to continue.</p>
    <div class="gate-row">
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
      <button id="go" type="button">Enter</button>
    </div>
    <div id="gate-err" role="status"></div>
    <textarea id="gate-out" rows="3" readonly hidden aria-label="Your password code"></textarea>
    <div class="gate-foot" id="gate-foot"></div>
  </div>
</div>

<!-- ================= App ================= -->
<div id="app">
  <header class="titlebar">
    <button class="menu-btn" id="menu" type="button" aria-label="Show pages list">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>
    <span class="brand" id="brand">Pages Hub</span>
    <span class="center" id="cur-title"></span>
    <div class="idle" id="idle" title="Signs out automatically when idle">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15 14"></polyline></svg>
      <span class="lbl">Auto sign-out in</span><span id="idle-t">15:00</span>
    </div>
    <button class="tb-btn" id="signout" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      <span>Sign out</span>
    </button>
  </header>

  <div class="body">
    <nav id="side" aria-label="Pages">
      <div class="searchrow">
        <input id="q" type="search" placeholder="Search pages…" autocomplete="off" aria-label="Search pages">
        <button id="refresh" type="button" title="Refresh list" aria-label="Refresh list">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"></path></svg>
        </button>
      </div>
      <div class="label"><span>MY PAGES</span><span id="count"></span></div>
      <div id="list"></div>
      <div class="spacer"></div>
      <div class="lockinfo">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        <span>Password protected</span>
      </div>
    </nav>

    <main>
      <div class="bar">
        <h1 id="page-title">Welcome</h1>
        <button class="btn" id="reload" type="button" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"></path></svg>
          Reload
        </button>
        <button class="btn" id="full" type="button" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M21 8V5a2 2 0 0 0-2-2h-3"></path><path d="M3 16v3a2 2 0 0 0 2 2h3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg>
          Full screen
        </button>
      </div>
      <div class="viewport" id="viewport">
        <div class="welcome" id="welcome">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line></svg>
          <div class="t">Pick a page</div>
          <div class="s">Choose a page from the list. It opens here, inside the app.</div>
        </div>
        <iframe id="frame" title="Selected page" allow="fullscreen" hidden></iframe>
      </div>
    </main>
  </div>

  <footer>
    <span id="copy">© Pages Hub. All rights reserved.</span>
    <span>Developed by Ashok Sharma, Sr. M&amp;E Officer, ITSU, MoH&amp;FW</span>
  </footer>
</div>

<script src="config.js"></script>
<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const gate = {
    title:$("gate-title"), text:$("gate-text"), pw:$("pw"), go:$("go"),
    err:$("gate-err"), out:$("gate-out"), foot:$("gate-foot")
  };
  const frame = $("frame"), welcome = $("welcome"), listEl = $("list");
  const q = $("q"), count = $("count"), pageTitle = $("page-title"), curTitle = $("cur-title");
  const idleBox = $("idle"), idleT = $("idle-t");
  const CACHE_KEY = "pages-hub-cache-v2";

  /* ---- Settings check (config.js) ---- */
  if(typeof PASSWORD_HASH === "undefined" || typeof USERNAME === "undefined"){
    gate.text.textContent = "config.js was not found. Upload config.js next to index.html.";
    gate.pw.disabled = gate.go.disabled = true;
    return;
  }
  const IDLE_MS = Math.max(0.05, Number(typeof IDLE_MINUTES === "number" ? IDLE_MINUTES : 15)) * 60000;
  const APP_TITLE = (typeof TITLE === "string" && TITLE) ? TITLE : "Pages Hub";
  document.title = APP_TITLE;
  $("brand").textContent = APP_TITLE;
  gate.title.textContent = APP_TITLE;
  $("copy").textContent = "© " + new Date().getFullYear() + " " + APP_TITLE + ". All rights reserved.";
  gate.foot.textContent = "Developed by Ashok Sharma, Sr. M&E Officer, ITSU, MoH&FW";

  let items = [], current = null, loaded = false;

  /* ================= Pages list ================= */
  function pageUrl(repo){
    const root = (USERNAME + ".github.io").toLowerCase();
    return repo.name.toLowerCase() === root
      ? "https://" + USERNAME + ".github.io/"
      : "https://" + USERNAME + ".github.io/" + repo.name + "/";
  }

  // The hub's own repo is never listed: from the address it is running at,
  // work out which repo it lives in (username.github.io, or username.github.io/<repo>/).
  function ownRepoName(){
    const host = location.hostname.toLowerCase();
    if(!host.endsWith(".github.io")) return "";
    const first = location.pathname.split("/").filter(Boolean)[0];
    return (first && !/\.[a-z0-9]+$/i.test(first) ? first : host).toLowerCase();
  }
  const OWN_REPO = ownRepoName();

  function renderList(){
    const term = q.value.trim().toLowerCase();
    const shown = items.filter(i => (i.name + " " + (i.desc || "")).toLowerCase().includes(term));
    listEl.innerHTML = "";
    if(!shown.length){
      const d = document.createElement("div");
      d.className = "note";
      d.textContent = items.length ? "No pages match your search." : "No pages found.";
      listEl.appendChild(d);
    }
    shown.forEach(i => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "item" + (current && current.url === i.url ? " sel" : "");
      const n = document.createElement("span"); n.className = "n"; n.textContent = i.name;
      const d = document.createElement("span"); d.className = "d"; d.textContent = i.desc || "";
      b.appendChild(n); if(i.desc) b.appendChild(d);
      b.addEventListener("click", () => select(i));
      listEl.appendChild(b);
    });
    count.textContent = items.length ? shown.length + "/" + items.length : "";
  }

  function select(i){
    current = i;
    welcome.hidden = true;
    frame.hidden = false;
    frame.src = i.url;
    pageTitle.textContent = i.name;
    curTitle.textContent = i.name;
    ["reload","full"].forEach(id => $(id).disabled = false);
    document.body.classList.remove("drawer");
    renderList();
    touch();
  }

  async function loadList(force){
    if(USERNAME === "YOUR-GITHUB-USERNAME"){
      listEl.innerHTML = '<div class="note">Open config.js and set USERNAME to your GitHub username.</div>';
      return;
    }
    listEl.innerHTML = '<div class="note">Loading…</div>';
    let repos = null;
    try{
      if(!force){
        const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
        if(c && c.user === USERNAME && Date.now() - c.t < 3600e3) repos = c.repos;
      }
    }catch(e){}
    if(!repos){
      try{
        repos = [];
        for(let p = 1; p <= 5; p++){
          const r = await fetch("https://api.github.com/users/" + USERNAME + "/repos?per_page=100&page=" + p + "&sort=updated");
          if(!r.ok) throw new Error(r.status);
          const batch = await r.json();
          repos.push(...batch);
          if(batch.length < 100) break;
        }
        try{
          const slim = repos.map(r => ({name:r.name, description:r.description, has_pages:r.has_pages, fork:r.fork}));
          localStorage.setItem(CACHE_KEY, JSON.stringify({user:USERNAME, t:Date.now(), repos:slim}));
        }catch(e){}
      }catch(e){
        repos = null;
        try{ const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); if(c && c.user === USERNAME) repos = c.repos; }catch(_){}
        if(!repos){
          items = EXTRA.map(x => ({name:x.name, desc:x.desc, url:x.url}));
          renderList();
          if(!items.length) listEl.innerHTML = '<div class="note">Could not reach GitHub (offline or rate limit). Try Refresh in a few minutes.</div>';
          return;
        }
      }
    }
    items = repos
      .filter(r => r.has_pages && !r.fork && !HIDE.includes(r.name) && r.name.toLowerCase() !== OWN_REPO)
      .map(r => {
        const a = ALIASES[r.name] || {};
        return {repo:r.name, name:a.name || r.name, desc:a.desc !== undefined ? a.desc : r.description, url:pageUrl(r)};
      })
      .concat(EXTRA.map(x => ({name:x.name, desc:x.desc, url:x.url})));
    renderList();
    openDefault();
  }

  // Opens the default page (DEFAULT_PAGE in config.js, else the Immunization Dashboard).
  function openDefault(){
    if(current || !items.length) return;
    const want = (typeof DEFAULT_PAGE === "string" && DEFAULT_PAGE ? DEFAULT_PAGE : "Imm_dashboard").trim().toLowerCase();
    const hit = items.find(i => (i.repo || "").toLowerCase() === want || (i.name || "").toLowerCase() === want)
             || items.find(i => (i.name + " " + (i.repo || "")).toLowerCase().includes("immunization") || (i.repo || "").toLowerCase().includes("imm_dashboard"));
    if(hit) select(hit);
  }

  /* ================= Toolbar buttons ================= */
  $("reload").addEventListener("click", () => {
    if(!current) return;
    try{ frame.contentWindow.location.reload(); }catch(e){ frame.src = current.url; }
    touch();
  });
  $("full").addEventListener("click", () => {
    const v = $("viewport");
    try{ (v.requestFullscreen || v.webkitRequestFullscreen).call(v); }catch(e){}
  });
  $("refresh").addEventListener("click", () => loadList(true));
  q.addEventListener("input", renderList);
  $("menu").addEventListener("click", () => document.body.classList.toggle("drawer"));
  $("signout").addEventListener("click", () => lock("You have signed out."));

  /* ================= Inactivity timer ================= */
  const EVENTS = ["mousemove","mousedown","keydown","scroll","wheel","touchstart","click"];
  let last = Date.now(), ticker = null;
  function touch(){ last = Date.now(); }
  EVENTS.forEach(ev => document.addEventListener(ev, touch, {passive:true, capture:true}));
  function hookFrame(){
    try{
      const d = frame.contentDocument;
      if(d) EVENTS.forEach(ev => d.addEventListener(ev, touch, {passive:true, capture:true}));
    }catch(e){ /* page from another site: cannot watch it */ }
  }
  frame.addEventListener("load", () => { if(frame.src && frame.src !== "about:blank"){ touch(); hookFrame(); } });
  function fmt(ms){
    const s = Math.ceil(ms / 1000), m = Math.floor(s / 60), r = s % 60;
    return m + ":" + String(r).padStart(2, "0");
  }
  function tick(){
    const left = IDLE_MS - (Date.now() - last);
    if(left <= 0){
      const mins = IDLE_MS >= 60000 ? Math.round(IDLE_MS / 60000) + " minutes" : Math.round(IDLE_MS / 1000) + " seconds";
      lock("Signed out after " + mins + " of inactivity.");
      return;
    }
    idleT.textContent = fmt(left);
    idleBox.classList.toggle("warn", left < 60000);
  }
  function startTimer(){ touch(); tick(); clearInterval(ticker); ticker = setInterval(tick, 1000); }

  /* ================= Lock / unlock ================= */
  function lock(message){
    clearInterval(ticker); ticker = null;
    try{ sessionStorage.removeItem("hub-ok"); }catch(e){}
    try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
    frame.src = "about:blank";
    frame.hidden = true;
    welcome.hidden = false;
    current = null;
    pageTitle.textContent = "Welcome";
    curTitle.textContent = "";
    ["reload","full"].forEach(id => $(id).disabled = true);
    document.body.classList.remove("drawer");
    document.body.classList.add("locked");
    q.value = "";
    gate.pw.value = "";
    gate.go.disabled = false;
    gate.err.className = "info";
    gate.err.textContent = message || "";
    gate.pw.focus();
  }
  function unlock(){
    document.body.classList.remove("locked");
    gate.err.textContent = "";
    try{ sessionStorage.setItem("hub-ok", PASSWORD_HASH); }catch(e){}
    startTimer();
    renderList();
    if(!loaded){ loaded = true; loadList(false); } else openDefault();
  }

  /* ================= Password gate ================= */
  async function sha256(text){
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("hub::" + text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }
  if(!window.crypto || !crypto.subtle){
    gate.err.textContent = "This browser cannot run the password check. Open the page over https.";
    gate.pw.disabled = gate.go.disabled = true;
    return;
  }

  if(!PASSWORD_HASH){
    // Setup mode: choose a password, get a code for config.js
    gate.title.textContent = "Set a password";
    gate.text.textContent = "Type the password you want and tap Make code. Copy ONLY the code shown and paste it between the quotes in config.js:  const PASSWORD_HASH = \"\";";
    gate.go.textContent = "Make code";
    const make = async () => {
      if(gate.pw.value.length < 6){ gate.err.className = ""; gate.err.textContent = "Use at least 6 characters."; return; }
      try{
        gate.err.textContent = "";
        gate.out.hidden = false;
        gate.out.value = await sha256(gate.pw.value);
        gate.out.select();
      }catch(e){ gate.err.className = ""; gate.err.textContent = "Error: " + e.message; }
    };
    gate.go.addEventListener("click", make);
    gate.pw.addEventListener("keydown", e => { if(e.key === "Enter") make(); });
    return;
  }

  let tries = 0;
  const check = async () => {
    if(gate.go.disabled) return;
    gate.err.className = "info";
    gate.err.textContent = "Checking…";
    try{
      const h = await sha256(gate.pw.value);
      if(h === PASSWORD_HASH.trim().toLowerCase()){ tries = 0; unlock(); return; }
      tries++;
      gate.err.className = "";
      gate.err.textContent = "Wrong password. Try again.";
      gate.pw.value = "";
      gate.go.disabled = true;
      setTimeout(() => { gate.go.disabled = false; }, Math.min(tries * 1000, 8000));
    }catch(e){ gate.err.className = ""; gate.err.textContent = "Error: " + e.message; }
  };
  gate.go.addEventListener("click", check);
  gate.pw.addEventListener("keydown", e => { if(e.key === "Enter") check(); });

  let remembered = false;
  try{ remembered = sessionStorage.getItem("hub-ok") === PASSWORD_HASH; }catch(e){}
  if(remembered) unlock(); else gate.pw.focus();
})();
</script>
</body>
</html>
